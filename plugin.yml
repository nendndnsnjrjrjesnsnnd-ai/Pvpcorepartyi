name: PvPCoreParty
version: 1.0.0
main: dev.pvpcore.party.PartyPlugin
api-version: "1.21"
depend: [PvPCore]
softdepend: [PlaceholderAPI]
authors: [PvPCoreParty]
description: Party system for PvPCore (party FFA and team war).
commands:
  p:
    description: Party komutlari
    usage: /p <davet|kabul|reddet|at|transfer|dagit|sohbet|temizle|ayril|liste|menu>
    aliases: [party, parti]
permissions:
  pvpcoreparty.use:
    default: true
  pvpcoreparty.bypass:
    default: op
